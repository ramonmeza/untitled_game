[project]
name = "untitled-game"
version = "0.1.0"
description = "Just an untitled game."
readme = "README.md"
authors = [
    { name = "Ramon Meza", email = "ramon_meza@live.com" }
]
requires-python = ">=3.13"
dependencies = [
    "raylib>=6.0.1.0",
]

[project.scripts]
untitled-game = "untitled_game:__main__"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "circular-import-detector>=1.0.18",
    "pylint>=4.1.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length=100

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 80
