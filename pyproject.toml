[project]
name = "untitled-game"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ramon Meza", email = "ramon_meza@live.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pygame-ce>=2.5.8",
    "raylib>=6.0.1.0",
]

[project.scripts]
untitled-game = "untitled_game:__main__"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "must-annotate>=0.1.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length=100
